nk);border-bottom:1px solid var(--line);padding:16px 0;margin:12px 0 20px}.stat output{font-size:40px;line-height:1.3;font-variant-numeric:tabular-nums}.stat output small{font-size:20px;margin-left:6px}.reroll{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.ability-note{margin-top:34px;max-width:26em;color:var(--muted);font-size:16px}

<body>
<main id="view"></main>
<script>
const query=new URLSearchParams(location.search), still=query.has('still');
const state={scenario:0,assistant:0,speeds:[104,108],tutorial:true};
const names=['이안','서린'], view=document.getElementById('view');
let timer;
const isPrototype=()=>!location.hash.startsWith('#full/');
const currentScreen=()=>location.hash.slice(1).split('/').pop()||'boot';
function go(screen){location.hash=(isPrototype()?'':'full/')+screen}
function button(label,action,kind=''){return `<button type="button" data-action="${action}" class="btn ${kind}">${label}</button>`}
function steps(active){return `<ol class="steps" aria-label="새 게임 준비 단계">${['시나리오','맵','조수'].map((s,i)=>`<li ${i===active?'aria-current="step"':''}><b>${String(i+1).padStart(2,'0')}</b>${s}</li>`).join('')}</ol>`}
function setup(i,title,subtitle,body,next,label,selection){return `<section class="screen setup"><header class="masthead"><span class="brand">Doom-Inc / 새 게임</span>${steps(i)}</header><div class="page-heading"><h1 tabindex="-1">${title}</h1><p>${subtitle}</p></div><div class="body">${body}</div><footer class="footer">${button('← 이전',['title','scenario','map'][i],'quiet')}<p class="selection">선택한 항목<strong>${selection}</strong></p>${button(label+' →',next,'primary')}</footer></section>`}
function terrain(){return `<svg class="terrain" viewBox="0 0 700 470" role="img" aria-label="수림 평지 개념도. 중앙 시작 터 주변으로 숲과 채취지가 흩어져 있다."><defs><pattern id="trees" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M15 5l-8 15h16zM15 20v5" fill="none" stroke="#818876" stroke-width="1.2"/></pattern></defs><path d="M0 0H700V470H0Z" fill="#d4d5cb"/><path d="M0 0H700V120Q570 85 480 151T272 110T0 192Z" fill="url(#trees)"/><path d="M0 270Q130 245 190 353T386 395T700 315V470H0Z" fill="url(#trees)"/><g fill="none" stroke="#b0b5a4"><path d="M-20 219Q80 130 211 201T478 190T750 126"/><path d="M-20 229Q80 140 211 211T478 200T750 136"/><path d="M-20 239Q80 150 211 221T478 210T750 146"/></g><path d="M259 151L420 161 476 245 417 316 252 299 218 229Z" fill="#e8e9df" stroke="#9fa591" stroke-dasharray="7 6"/><g stroke="#686f5d" fill="#aeb5a0"><path d="M516 267l12-15 17 8-3 19h-23zM542 289l8-17 20 8-6 18zM157 178l12-12 16 14-7 13h-18z"/><circle cx="267" cy="205" r="7"/><circle cx="278" cy="214" r="5"/><circle cx="257" cy="216" r="4"/></g><g stroke="#3c4434" fill="none" stroke-width="2"><circle cx="350" cy="235" r="17"/><path d="M350 211v48M326 235h48"/></g><g font-family="Malgun Gothic,sans-serif" font-size="17" fill="#3e4537"><text x="350" y="278" text-anchor="middle">시작 터</text><text x="185" y="190">생체 원료</text><text x="540" y="242">석재</text><text x="99" y="81">숲</text></g><path d="M650 65V30l-5 10m5-10 5 10" fill="none" stroke="#626b56"/><text x="650" y="23" text-anchor="middle" font-size="12" fill="#626b56">N</text></svg>`}
function portrait(index,mini=false){return `<svg class="${mini?'':'portrait'}" viewBox="0 0 260 320" aria-hidden="true"><g stroke="#555b4d" stroke-width="2" fill="none"><path d="M35 309Q40 232 90 213L102 198H158L174 215Q224 233 228 309" fill="#c6c9bd"/><path d="M101 198l29 38 29-38M90 215l-16 42 35-6-8 58M172 215l15 42-35-6 8 58"/><path d="M88 100Q89 58 130 57T173 100V153Q168 194 130 207Q91 195 87 153Z" fill="#e0e2d6"/><path d="M84 132Q67 56 129 48Q192 44 177 132L160 100Q123 130 87 111Z" fill="#737b69"/><path d="M109 148h5m34 0h5M127 153l-3 18 9 0M118 183q12 5 23 0"/>${index===1?'<rect x="96" y="137" width="29" height="21" rx="4"/><rect x="138" y="137" width="29" height="21" rx="4"/><path d="M125 144h13"/>':''}<path d="M129 236v72M178 273h25v18h-25z"/><circle cx="138" cy="263" r="2"/><circle cx="138" cy="291" r="2"/></g></svg>`}
function backdrop(){return `<div class="lab-backdrop" aria-hidden="true"><svg viewBox="0 0 950 800" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="currentColor" stroke-width="1"><path d="M80 660L950 455M160 800L950 565M310 800L950 650M0 510L950 728M180 440L950 620M330 380L950 528" opacity=".3"/><path d="M320 510V253l350-86 166 96v260l-353 93z"/><path d="M320 253l163 94 353-84M483 347v269M320 510l163 106M375 476V326l55 32v149zM538 464V383l99-24v81zM670 433V350l99-24v82z"/><path d="M290 530l192 111 382-106M290 530v20l192 112 382-106v-21M350 244v-47l350-85 111 65v73M700 112v80M750 142v-62l28-7 21 12v70M750 80l22 12 27-7M772 92v63"/><g transform="translate(530 420)"><ellipse cx="20" cy="0" rx="36" ry="18"/><path d="M-16 0v80q36 36 72 0V0M-16 24q36 31 72 0M-16 72q36 31 72 0"/><ellipse cx="20" cy="99" rx="47" ry="22"/><circle cx="20" cy="49" r="13"/></g><path d="M700 450l55-14 30 18-55 15zM700 450v28l30 18 55-14v-28M730 469v27"/></g></svg></div>`}
function render(){
  clearTimeout(timer);
  const screen=currentScreen(), prototype=isPrototype(), previousFocus=document.activeElement?.dataset.action;
  let html='';
  if(screen==='title'){
    html=`<section class="screen title">${backdrop()}<div class="brand">재앙 연구소</div><h1 tabindex="-1">Doom-Inc</h1><nav class="title-menu" aria-label="메인 메뉴"><button data-action="scenario">게임 시작</button><button disabled>이어하기<small>저장된 연구소 없음</small></button><button data-action="settings">설정</button></nav><div class="version">첫 프로토타입</div><div class="backdrop-caption">배경 일러스트 영역 · 배치용 선화</div></section>`;
  }else if(screen==='scenario'){
    const list=prototype?['연구소 정착']:['기본','완전 무작위'];
    if(state.scenario>=list.length)state.scenario=0;
    const captions=prototype?['전투력에 따라 시작되는 첫 습격']:['정착 이후의 첫 토벌군','시작 직후에도 찾아오는 위협'];
    const desc=prototype?'민트색 개체와 주머니 개체의 합산 전투력이 기준에 도달하면 첫 습격이 시작됩니다.':state.scenario===0?'정착할 시간을 가진 뒤 첫 토벌군의 접근을 예고합니다.':'시작 직후에도 첫 토벌군의 접근 예고가 발생할 수 있습니다.';
    const route=prototype?['생명체 배양','전투력 기준 도달','첫 습격']:state.scenario===0?['연구소 정착','첫 접근 예고','토벌군 도착']:['게임 시작','언제든 접근 예고','토벌군 도착'];
    const body=`<div class="scenario-layout"><nav aria-label="시나리오 목록"><div class="list-title">시나리오 목록</div>${list.map((name,i)=>`<button class="scenario-option" data-action="pick-${i}" aria-pressed="${state.scenario===i}"><strong>${name}</strong><small>${captions[i]}</small></button>`).join('')}<p class="scope-note">${prototype?'첫 프로토타입에서는 하나의 시나리오를 플레이합니다.':'시나리오마다 첫 위협이 시작되는 시점이 다릅니다.'}</p></nav><article class="scenario-info"><div class="eyebrow">선택한 시나리오</div><h2>${list[state.scenario]}</h2><p>생명체를 배양하고, 함께 일할 연구소를 세웁니다.</p><div class="rule"><h3>첫 위협이 찾아오는 시점</h3><p>${desc}</p><div class="rule-track">${route.map(x=>`<span>${x}</span>`).join('<i>→</i>')}</div></div></article></div>`;
    html=setup(0,'시나리오 선택','어떤 시작을 맞이할지 정합니다.',body,'map','맵 선택으로',list[state.scenario]);
  }else if(screen==='map'){
    const body=`<div class="map-layout"><div><div class="map-preview">${terrain()}<span class="map-scale">250 × 250칸 · 지형 개념도</span></div><div class="legend"><span>△ 숲과 채취지</span><span>⊙ 연구소 시작 위치</span></div></div><aside class="map-info"><div class="list-title">시작할 맵</div><button class="map-choice" data-action="pick-0" aria-pressed="true">수림 평지<span>✓</span></button><p>숲으로 둘러싸인 넓은 중앙 터.<br>빈터에서 첫 연구소를 시작합니다.</p><h3>시작 터 주변</h3><ul class="facts"><li><span>건설 재료</span><strong>목재 · 석재</strong></li><li><span>첫 배양</span><strong>가까운 생체 원료</strong></li><li><span>맵 크기</span><strong>250 × 250칸</strong></li></ul><p class="scope-note">나무와 돌의 위치를 살펴보고 첫 방을 어디에 지을지 정해 보세요.</p></aside></div>`;
    html=setup(1,'맵 선택','연구소를 세울 터를 살펴봅니다.',body,'assistant','조수 선택으로','수림 평지');
  }else if(screen==='assistant'){
    const body=`<div class="assistant-layout"><div class="casting"><span class="art-label">인물 일러스트 영역</span>${portrait(state.assistant)}<nav class="candidate-strip" aria-label="조수 후보">${names.map((name,i)=>`<button class="candidate" data-action="pick-${i}" aria-pressed="${state.assistant===i}">${portrait(i,true)}<span>${name}</span></button>`).join('')}</nav></div><article class="dossier"><div class="eyebrow">함께 시작할 조수</div><h2>${names[state.assistant]}</h2><p class="specialty">전문 계통 · 제조 / 연금</p><div class="stat"><span>연구 속도</span><output aria-live="polite">${state.speeds[state.assistant]}<small>%</small></output></div><div class="reroll">${button('↻ 능력치 다시 굴리기','roll')}<span class="small muted">횟수 제한 없음</span></div><p class="ability-note">전문 계통의 연구에서 속도 이점을 얻습니다. 다른 계통의 연구도 진행할 수 있습니다.</p></article></div>`;
    html=setup(2,'조수 선택','첫 배양과 연구를 함께할 동료를 고릅니다.',body,'loading','연구소로',names[state.assistant]);
  }else if(screen==='boot'){
    const error=query.get('error')==='boot';
    html=`<section class="screen boot"><div><div class="mark" aria-hidden="true"></div><h1 tabindex="-1">Doom-Inc</h1><p class="boot-subtitle">재앙 연구소</p></div><div class="boot-status" role="status">${error?'게임 데이터를 확인하지 못했습니다.':'게임 데이터를 확인하고 있습니다.'}${error?`<div class="error-actions">${button('다시 시도','retry-boot')}</div>`:'<div class="track"><i></i></div>'}</div></section>`;
    if(!still&&!error)timer=setTimeout(()=>go('title'),2000);
  }else if(screen==='loading'){
    const error=query.get('error')==='loading';
    html=`<section class="screen loading">${terrain()}<div class="loading-content"><div><div class="small muted">${prototype?'연구소 정착':['기본','완전 무작위'][state.scenario]} / ${names[state.assistant]}</div><h1 tabindex="-1">수림 평지</h1><p>숲 가장자리에서, 첫 연구소가 시작됩니다.</p></div><div role="status"><p>${error?'시작 위치를 준비하지 못했습니다.':'연구소 불러오는 중'}</p>${error?`<div class="error-actions">${button('다시 시도','retry-loading')}${button('이전으로','assistant')}</div>`:'<p class="small muted">시작 위치를 준비하고 있습니다.</p><div class="track"><i></i></div>'}</div></div></section>`;
    if(!still&&!error)timer=setTimeout(()=>go('arrival'),2000);
  }else if(screen==='clear'){
    html=`<section class="screen clear"><div class="planet" aria-hidden="true"></div><div class="result-copy"><div class="eyebrow">행성 전체 침공 완료</div><h1 tabindex="-1">게임 클리어</h1><p>이 행성의 모든 침공을 완료했습니다.<br>당신의 연구소는 계속됩니다.</p><div class="result-actions">${button('계속 플레이','returnlab','primary')}${button('메인 화면으로','title','quiet')}</div></div></section>`;
  }else if(screen==='defeat'){
    html=`<section class="screen defeat"><div class="defeat-content"><div class="broken-line" aria-hidden="true"></div><h1 tabindex="-1">패배</h1><div class="reason"><small>연구소 운영 종료</small><p>주인공의 체력이 0이 되었습니다.</p></div>${button('메인 화면으로','title','primary')}</div></section>`;
  }else if(screen==='settings'){
    html=`<section class="screen settings-screen"><div class="settings-panel"><h1 tabindex="-1">설정</h1><div class="setting-row"><div><h3>첫 플레이 튜토리얼</h3><p>첫 배양을 지시하는 방법을 안내합니다.<br>첫 만남 대화는 설정과 관계없이 재생됩니다.</p></div><button type="button" class="btn" data-action="tutorial" role="switch" aria-checked="${state.tutorial}">${state.tutorial?'켜짐':'꺼짐'}</button></div>${button('← 돌아가기','title','quiet')}</div></section>`;
  }else if(screen==='arrival'||screen==='returnlab'){
    html=`<section class="screen handoff"><div class="settings-panel"><div class="eyebrow">와이어프레임 연결 지점</div><h1 tabindex="-1">${screen==='arrival'?'첫 만남 대화로':'연구소 운영 재개'}</h1><p>${screen==='arrival'?`수림 평지에서 주인공과 ${names[state.assistant]}의 첫 만남 대화가 시작됩니다. 튜토리얼은 ${state.tutorial?'켜짐':'꺼짐'} 상태입니다.`:'클리어한 연구소에서 운영을 이어갑니다.'}</p><p class="scope-note">이후 인게임 화면은 기존 시안을 유지합니다.</p>${button('타이틀 시안으로','title','quiet')}</div></section>`;
  }else{go('title');return}
  view.innerHTML=html;
  if(previousFocus){const target=Array.from(view.querySelectorAll('button')).find(b=>b.dataset.action===previousFocus);if(target)target.focus({preventScroll:true});else view.querySelector('h1')?.focus({preventScroll:true})}
}
view.addEventListener('click',event=>{
  const action=event.target.closest('button')?.dataset.action;if(!action)return;
  const screen=currentScreen();
  if(action.startsWith('pick-')){const n=Number(action.slice(5));if(screen==='scenario')state.scenario=n;if(screen==='assistant')state.assistant=n;render();return}
  if(action==='roll'){state.speeds[state.assistant]=90+Math.floor(Math.random()*31);render();return}
  if(action==='tutorial'){state.tutorial=!state.tutorial;render();return}
  if(action.startsWith('retry-')){query.delete('error');const url=new URL(location.href);url.searchParams.delete('error');history.replaceState(null,'',url);render();return}
  go(action);
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
